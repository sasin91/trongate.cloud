services:
  ${PROJECT_ID}_traefik:
    image: traefik:v3.6.7
    container_name: ${PROJECT_ID}_traefik
    networks:
      - ${PROJECT_ID}_net
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--metrics.prometheus=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  ${PROJECT_ID}_app:
    image: ghcr.io/trongate/trongate-v2:latest
    container_name: ${PROJECT_ID}_app
    environment:
      - DB_HOST=${PROJECT_ID}_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - ENV=production
      - BASE_URL=https://${DOMAIN}/
      - REDIS_HOST=${PROJECT_ID}_redis
      - REDIS_PORT=6379
    depends_on:
      - ${PROJECT_ID}_db
      - ${PROJECT_ID}_redis
    networks:
      - ${PROJECT_ID}_net
    volumes:
      - /var/www/${PROJECT_ID}/app:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_ID}_app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${PROJECT_ID}_app.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_ID}_app.tls.certresolver=letsencrypt"
      - "traefik.http.services.${PROJECT_ID}_app.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 512M

  ${PROJECT_ID}_db:
    image: mariadb:11.2
    container_name: ${PROJECT_ID}_db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ${PROJECT_ID}_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  ${PROJECT_ID}_node-exporter:
    image: prom/node-exporter:latest
    container_name: ${PROJECT_ID}_node-exporter
    networks:
      - ${PROJECT_ID}_net
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  ${PROJECT_ID}_prometheus:
    image: prom/prometheus:latest
    container_name: ${PROJECT_ID}_prometheus
    networks:
      - ${PROJECT_ID}_net
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  ${PROJECT_ID}_net:
    driver: bridge

volumes:
  db_data:
