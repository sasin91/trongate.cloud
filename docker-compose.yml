services:
  tcloud_traefik:
    image: traefik:v3.6.7
    container_name: tcloud_traefik
    networks:
      - tcloud_net
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
    ports:
      - "${HTTP_PORT:-8085}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  tcloud_app:
    build:
      context: .
      target: prod
    container_name: tcloud_app
    environment:
      - PLATFORM_SSH_PUBLIC_KEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMh5bW8G35m2fDaceUDRuKNv6J8EB3YNNdmLNO9wMDei platform@trongate.cloud
      - PLATFORM_SSH_CA_PUBLIC_KEY=${PLATFORM_SSH_CA_PUBLIC_KEY}
    depends_on:
      tcloud_db:
        condition: service_healthy
    networks:
      - tcloud_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tcloud_app.rule=Host(`localhost`) || Host(`127.0.0.1`)"
      - "traefik.http.services.tcloud_app.loadbalancer.server.port=80"
      - "traefik.http.services.tcloud_app.loadbalancer.server.weight=90"
    logging:
      driver: "json-file"

  tcloud_node-exporter:
    image: prom/node-exporter:latest
    container_name: tcloud_node-exporter
    networks:
      - tcloud_net
    labels:
      - "traefik.enable=false"
    ports:
      - "9100:9100"
    command:
      - "--path.rootfs=/host"

  tcloud_db:
    image: mariadb:11.2
    container_name: tcloud_db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=tcloud
      - MYSQL_USER=tcloud_user
      - MYSQL_PASSWORD=tcloud_password
      - MARIADB_BUFFER_POOL_SIZE=256M
      - MARIADB_MAX_CONNECTIONS=50
    labels:
      - "traefik.enable=false"
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - tcloud_net
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tcloud_prometheus:
    image: prom/prometheus:latest
    container_name: tcloud_prometheus
    networks:
      - tcloud_net
    labels:
      - "traefik.enable=false"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  tcloud_alertmanager:
    image: prom/alertmanager:latest
    container_name: tcloud_alertmanager
    networks:
      - tcloud_net
    labels:
      - "traefik.enable=false"
    volumes:
      - ./docker/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  tcloud_ssh_cert_manager:
    build:
      context: .
      dockerfile: Dockerfile.ssh-cert-manager
    container_name: tcloud_ssh_cert_manager
    environment:
      - CA_PRIVATE_KEY=${CA_PRIVATE_KEY}
      - CERT_VALIDITY_HOURS=${CERT_VALIDITY_HOURS:-24}
      - RENEWAL_THRESHOLD_HOURS=${RENEWAL_THRESHOLD_HOURS:-6}
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-300}
    networks:
      - tcloud_net
    labels:
      - "traefik.enable=false"
    volumes:
      # Shared volume for SSH certificates (platform authentication)
      - platform_ssh_certs:/certs
    restart: unless-stopped
    logging:
      driver: "json-file"

  tcloud_tasks:
    build:
      context: .
      dockerfile: Dockerfile.server-tasks
    container_name: tcloud_tasks
    environment:
      - DB_HOST=tcloud_db
      - DB_USER=tcloud_user
      - DB_PASSWORD=tcloud_password
      - DB_NAME=tcloud
    depends_on:
      tcloud_db:
        condition: service_healthy
      tcloud_ssh_cert_manager:
        condition: service_started
    networks:
      - tcloud_net
    labels:
      - "traefik.enable=false"
    # Grace period for in-flight tasks to finish on deploy.
    # MUST match Runtime::STALE_THRESHOLD_SECONDS — tasks still running
    # after this period are marked stale on next worker startup.
    stop_grace_period: 300s
    restart: unless-stopped
    volumes:
      - ./modules/servers/tasks:/var/www/modules/servers/tasks:ro
      # Platform SSH certificates (managed by ssh-cert-manager)
      - platform_ssh_certs:/platform-certs:ro
    logging:
      driver: "json-file"

networks:
  tcloud_net:
    driver: bridge

volumes:
  db_data:
  platform_ssh_certs:
