name: Images

# Builds and pushes the platform images the cluster runs
# (deploy/k8s/platform/kustomization.yaml) to the cluster's own registry, the
# same one tenant builds go to, so the node needs one pull credential:
#   registry.trongate.cloud/platform/trongate-cloud         from Dockerfile
#   registry.trongate.cloud/platform/trongate-cloud-worker  from Dockerfile.worker
# Tags: `main` (what the cluster's kustomization points at) and `sha-<short>`.
# Multi-arch: the cluster node is arm64 (Hetzner CAX), amd64 keeps local
# development and x86 nodes working. arm64 is built under QEMU.
#
# Needs secret REGISTRY_PASSWORD (the registry's `push` user) and runs only once
# repository variable PLATFORM_REGISTRY_READY is "true": the registry lives in
# the cluster, so until it is up there is nothing to push to.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    if: vars.PLATFORM_REGISTRY_READY == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: trongate-cloud
            dockerfile: Dockerfile
          - image: trongate-cloud-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.trongate.cloud
          username: push
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.trongate.cloud/platform/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
