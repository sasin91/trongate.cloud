; On top of PHP's php.ini-production. The limits match what apps had on the
; Railpack image before (no memory, post or upload cap), so moving an app to
; this image changes nothing it relies on. Sessions are set per app by the
; zz-trongate-cloud-sessions.ini the pod mounts (Manifests::SESSIONS_INI_PATH).
memory_limit = -1
post_max_size = 0
upload_max_filesize = 0
