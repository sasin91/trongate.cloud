; Platform app (trongate.cloud) PHP settings, on top of PHP's defaults.
; The Database tab uploads a .sql file in parts of Sql_import::CHUNK_BYTES
; (4 MB); PHP's default of 2 MB per file would refuse them.
upload_max_filesize = 8M
post_max_size = 12M

; Before PHP 8.4.27, a request that runs out of memory can corrupt the next one
; (CVE-2026-109618), and upload progress reads session state an interrupted
; request leaves behind (CVE-2026-109619). The pod's 512Mi memory limit is the
; ceiling instead, as it already is for customer apps (docker/app-base/php.ini).
memory_limit = -1
session.upload_progress.enabled = 0
