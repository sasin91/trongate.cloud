global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - tcloud_alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    static_configs:
      - targets: ['tcloud_traefik:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['tcloud_node-exporter:9100']

  - job_name: 'metrics-exporter'
    static_configs:
      - targets: ['tcloud_metrics-exporter:9105']
