services:
  tcloud_traefik:
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--entrypoints.webSecure.address=:443"
      - "--entrypoints.web.address=:80"
      - "--metrics.prometheus=true"
    ports:
      - "443:443"
      - "80:80"
  tcloud_app:
    environment:
      - ENV=production
      - BASE_URL=https://trongate.cloud/
    labels:
      - "traefik.http.routers.tcloud_app.rule=Host(`trongate.cloud`)"
