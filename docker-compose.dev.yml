services:
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - tcloud_db
    environment:
      ADMINER_DEFAULT_SERVER: tcloud_db
    networks:
      - tcloud_net
    labels:
      - "traefik.enable=false"
    restart: unless-stopped

  tcloud_app:
    build:
      context: .
      target: dev
    environment:
      - XDEBUG_MODE=develop,debug
      - ENV=dev
      - DB_HOST=tcloud_db
      - DB_USER=tcloud_user
      - DB_PASSWORD=tcloud_password
      - DB_NAME=tcloud
      - ENV=dev
      - BASE_URL=http://localhost:8085/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
