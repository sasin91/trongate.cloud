# EXAMPLE ONLY. Copy, fill in, encrypt with SOPS, never commit plaintext.
# Use the same password in both Secrets (it is the MariaDB "juicefs" user's).
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-meta
  namespace: files
type: Opaque
stringData:
  password: CHANGE_ME_META_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-secret
  namespace: files
  labels:
    juicefs.com/validate-secret: "true"
type: Opaque
stringData:
  name: tenant-files
  metaurl: mysql://juicefs:CHANGE_ME_META_PASSWORD@(shared-1.databases.svc.cluster.local:3306)/juicefs
  storage: s3
  # Hetzner Object Storage: https://{bucket}.{location}.your-objectstorage.com
  bucket: https://CHANGE_ME_BUCKET.fsn1.your-objectstorage.com
  access-key: CHANGE_ME_ACCESS_KEY
  secret-key: CHANGE_ME_SECRET_KEY
  format-options: trash-days=7
