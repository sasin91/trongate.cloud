# Non-secret settings shared by the app and the worker (config/config.php,
# config/database.php, config/platform.php read these via getenv()).
# Secrets (APP_KEY, DB_PASSWORD) come from the trongate-cloud-env Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trongate-cloud
  namespace: trongate-cloud
data:
  BASE_URL: https://trongate.cloud/
  ENV: prod
  DB_HOST: platform.trongate-cloud.svc.cluster.local
  DB_PORT: "3306"
  DB_NAME: tcloud
  DB_USER: tcloud
  PLATFORM_APPS_DOMAIN: trongate.dev
  PLATFORM_REGISTRY: registry.trongate.cloud/tc
  # A push to main here rebuilds the platform images (worker build_platform
  # task) into PLATFORM_IMAGES_REGISTRY; Flux image automation in the infra
  # repository rolls them out. Empty turns it off.
  PLATFORM_SOURCE_REPOSITORY: sasin91/trongate.cloud
  PLATFORM_SOURCE_BRANCH: main
  PLATFORM_IMAGES_REGISTRY: registry.trongate.cloud/platform
  PLATFORM_GATEWAY_NAME: platform
  PLATFORM_GATEWAY_NAMESPACE: traefik
  # Custom domains: per-domain Gateways of this class, certificates from this
  # issuer, and the load balancer addresses their DNS must point at. Keep the
  # class and issuer in sync with worker-admission-policy.yaml and
  # the ClusterIssuer (infra repo, platform/configs/cluster-issuers.yaml), the
  # addresses with the load balancer.
  PLATFORM_GATEWAY_CLASS: traefik
  PLATFORM_DOMAIN_ISSUER: letsencrypt-tenants
  PLATFORM_INGRESS_IPV4: 142.132.241.236
  PLATFORM_INGRESS_IPV6: 2a01:4f8:c01e:2396::1
  SABLIER_URL: http://sablier.sablier.svc.cluster.local:10000
  FILES_STORAGE_CLASS: tenant-files
  # Shared Valkey for customer app sessions; the worker's password is in trongate-cloud-valkey
  VALKEY_HOST: valkey.cache.svc.cluster.local
  VALKEY_PORT: "6379"
  VALKEY_WORKER_USER: trongate-cloud
  # Seconds between missed-webhook checks (worker reconcile_deploys task); 0 = off
  DEPLOY_RECONCILE_INTERVAL: "600"
  # Seconds between custom-domain DNS rechecks (worker schedule_domain_rechecks task); 0 = off
  DOMAIN_RECHECK_INTERVAL: "600"
  # The mail inbox (mail.yaml) that apps with mail capture on send to
  PLATFORM_MAIL_HOST: trongate-cloud-mail.trongate-cloud.svc.cluster.local
  PLATFORM_MAIL_PORT: "2525"
