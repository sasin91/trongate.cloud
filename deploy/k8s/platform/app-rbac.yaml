# The web app reads its customers' apps (Deployments and Pods) to show their live
# state (modules/platform/live/App_state.php), and lists the other per-app
# kinds for the admin MCP's read-only orphan audit (App_resource_audit.php).
# Read-only, and no Secrets: writes stay with the worker (worker-rbac.yaml).
# Cluster-wide because tenant namespaces (one per project: project-*) are
# created on the fly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trongate-cloud-app
  namespace: trongate-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trongate-cloud-app
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list"]
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["databases", "users", "grants"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trongate-cloud-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trongate-cloud-app
subjects:
  - kind: ServiceAccount
    name: trongate-cloud-app
    namespace: trongate-cloud
