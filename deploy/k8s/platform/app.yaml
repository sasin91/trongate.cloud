# The platform web app (dashboard, GitHub webhooks, MCP endpoint at /mcp).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trongate-cloud-app
  namespace: trongate-cloud
  labels:
    app.kubernetes.io/name: trongate-cloud-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: trongate-cloud-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trongate-cloud-app
    spec:
      # Read-only access to tenant Deployments/Pods for live app state (app-rbac.yaml)
      serviceAccountName: trongate-cloud-app
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: trongate-cloud
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: trongate-cloud
            - secretRef:
                name: trongate-cloud-env
            # Only the app gets MCP_SECRET (the worker never needs it)
            - secretRef:
                name: trongate-cloud-mcp
                optional: true
            # The GitHub App (sign-in, webhook); docs/github-app.md
            - secretRef:
                name: trongate-cloud-github
                optional: true
          # Sessions live in Valkey under a user the worker creates when it
          # starts (Valkey_sessions); until then this pod takes no traffic and
          # the old pods keep serving. 10 minutes covers the worker's Recreate.
          # Passes on images without the script, which Flux may still run
          # under this manifest until the image tag is bumped.
          startupProbe:
            exec:
              command: ["sh", "-c", "test ! -f /app/bin/check-sessions.php || exec php /app/bin/check-sessions.php"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # FrankenPHP carries the cap_net_bind_service file capability; with
              # it outside the bounding set, exec fails ("Operation not
              # permitted") even on 8080. Restricted Pod Security allows this one.
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trongate-cloud-app
  namespace: trongate-cloud
spec:
  selector:
    app.kubernetes.io/name: trongate-cloud-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trongate-cloud-app
  namespace: trongate-cloud
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      namespace: traefik
      # The listener serving trongate.cloud (trongate-cloud-infra's
      # platform/configs/gateway.yaml)
      sectionName: https-platform
  hostnames:
    - trongate.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: trongate-cloud-app
          port: 80
