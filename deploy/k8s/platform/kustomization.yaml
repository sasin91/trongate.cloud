apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trongate-cloud
resources:
  - namespace.yaml
  - config.yaml
  - mariadb.yaml
  - database.yaml
  - git.yaml
  - app-rbac.yaml
  - app.yaml
  - worker-rbac.yaml
  - worker.yaml
  - mail.yaml
  - worker-admission-policy.yaml
# Not listed on purpose: secrets.example.yaml (create a SOPS-encrypted copy, see ../README.md)

# Built from ../../Dockerfile and ../../Dockerfile.worker by the worker's
# build_platform task on every push to main (or bin/push-images.sh) and pushed to
# the cluster's own registry. The cluster pins the tag in the infra repository,
# where Flux image automation updates it (../README.md, "Deploying the platform").
images:
  - name: trongate-cloud
    newName: registry.trongate.cloud/platform/trongate-cloud
    newTag: main
  - name: trongate-cloud-worker
    newName: registry.trongate.cloud/platform/trongate-cloud-worker
    newTag: main
