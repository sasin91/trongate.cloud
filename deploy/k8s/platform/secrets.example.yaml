# EXAMPLE ONLY. Copy, fill in, encrypt with SOPS, never commit plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: trongate-cloud-env
  namespace: trongate-cloud
type: Opaque
stringData:
  # php -r "echo base64_encode(sodium_crypto_secretbox_keygen());"
  # Shared by app + worker; also derives tenant DB passwords (Manifests::database_password)
  APP_KEY: CHANGE_ME
  # Password of the MariaDB user "tcloud" (database.yaml points the User CR here)
  DB_PASSWORD: CHANGE_ME
---
# App only (the worker does not load it). Bearer secret for the admin MCP
# endpoint (POST /mcp); leave the Secret out to disable it.
# php -r "echo bin2hex(random_bytes(32));"
apiVersion: v1
kind: Secret
metadata:
  name: trongate-cloud-mcp
  namespace: trongate-cloud
type: Opaque
stringData:
  MCP_SECRET: CHANGE_ME
---
# The trongate.cloud GitHub App (docs/github-app.md), for the app and the
# worker. Without it customers cannot connect GitHub and nothing builds.
apiVersion: v1
kind: Secret
metadata:
  name: trongate-cloud-github
  namespace: trongate-cloud
type: Opaque
stringData:
  # From the App's settings page (github.com/settings/apps/<slug>)
  GITHUB_APP_SLUG: CHANGE_ME
  GITHUB_APP_CLIENT_ID: CHANGE_ME
  GITHUB_APP_CLIENT_SECRET: CHANGE_ME
  # The webhook secret entered when registering the App. openssl rand -hex 32
  GITHUB_APP_WEBHOOK_SECRET: CHANGE_ME
  # The App's private key (.pem), as generated on its settings page
  GITHUB_APP_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    CHANGE_ME
    -----END RSA PRIVATE KEY-----
---
# Worker only. The worker's Valkey user (deploy/k8s/cache/secrets.example.yaml,
# user trongate-cloud), which creates each app's session user. Leave the Secret
# out and customer apps keep PHP file sessions inside their pods.
apiVersion: v1
kind: Secret
metadata:
  name: trongate-cloud-valkey
  namespace: trongate-cloud
type: Opaque
stringData:
  # openssl rand -hex 32; the same value as in valkey-acl
  VALKEY_WORKER_PASSWORD: CHANGE_ME
---
# Mail capture (mail.yaml, modules/platform/mail). MAIL_KEY signs the apps'
# inbox passwords: the worker writes them, the inbox checks them. The inbox
# signs in to MariaDB as tcloud_mail (database.yaml), limited to app_mail.
# Kept apart from APP_KEY and DB_PASSWORD because tenant pods can reach the inbox.
apiVersion: v1
kind: Secret
metadata:
  name: trongate-cloud-mail
  namespace: trongate-cloud
type: Opaque
stringData:
  # openssl rand -hex 32 (each)
  MAIL_KEY: CHANGE_ME
  MAIL_DB_PASSWORD: CHANGE_ME
---
# Root password of the platform MariaDB (mariadb.yaml). openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-platform
  namespace: trongate-cloud
type: Opaque
stringData:
  root-password: CHANGE_ME
---
# Push credentials for PLATFORM_REGISTRY, mounted into the worker as ~/.docker/config.json.
# Create with: kubectl create secret docker-registry registry-push -n trongate-cloud \
#   --docker-server=registry.trongate.cloud --docker-username=... --docker-password=... \
#   --dry-run=client -o yaml   (then encrypt with SOPS)
apiVersion: v1
kind: Secret
metadata:
  name: registry-push
  namespace: trongate-cloud
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.trongate.cloud":{"auth":"CHANGE_ME_BASE64_USER_COLON_TOKEN"}}}'
---
# App and worker. The S3 bucket deleted apps are backed up to before their
# database and files are removed (App_backup, tasks/destroy_app.php); the
# project can download the backup for 7 days. Leave the Secret out and a
# deleted app's database and files are kept instead, as before.
# The JuiceFS bucket (deploy/k8s/files, juicefs-secret) works: JuiceFS keeps
# its data under {name}/ (tenant-files/), backups go under app-backups/. Use
# its bucket name and key pair here, endpoint and region from its URL.
#
# The nightly backups of every app and of the platform database (Daily_backup)
# go to the same bucket under daily/, kept 30 days, encrypted to
# APP_BACKUPS_PUBLIC_KEY. Make the pair with `composer backup:keys`, put
# only the public key here and keep the private key offline (two copies):
# without it no backup can be read. Leave APP_BACKUPS_PUBLIC_KEY out and no
# nightly backups are taken. A bucket of their own, in another location than
# the JuiceFS bucket, keeps them apart from the data they back up.
apiVersion: v1
kind: Secret
metadata:
  name: trongate-cloud-backups
  namespace: trongate-cloud
type: Opaque
stringData:
  APP_BACKUPS_S3_ENDPOINT: https://fsn1.your-objectstorage.com
  APP_BACKUPS_S3_REGION: fsn1
  APP_BACKUPS_S3_BUCKET: CHANGE_ME
  APP_BACKUPS_S3_ACCESS_KEY: CHANGE_ME
  APP_BACKUPS_S3_SECRET_KEY: CHANGE_ME
  APP_BACKUPS_PUBLIC_KEY: CHANGE_ME
