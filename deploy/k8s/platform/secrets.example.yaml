# EXAMPLE ONLY. Copy, fill in, encrypt with SOPS, never commit plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: trongate-cloud-env
  namespace: trongate-cloud
type: Opaque
stringData:
  # php -r "echo base64_encode(sodium_crypto_secretbox_keygen());"
  # Shared by app + worker; also derives tenant DB passwords (Manifests::database_password)
  APP_KEY: CHANGE_ME
  # Password of the MariaDB user "tcloud" (database.yaml points the User CR here)
  DB_PASSWORD: CHANGE_ME
---
# App only (the worker does not load it). Bearer secret for the admin MCP
# endpoint (POST /mcp); leave the Secret out to disable it.
# php -r "echo bin2hex(random_bytes(32));"
apiVersion: v1
kind: Secret
metadata:
  name: trongate-cloud-mcp
  namespace: trongate-cloud
type: Opaque
stringData:
  MCP_SECRET: CHANGE_ME
---
# Root password of the platform MariaDB (mariadb.yaml). openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-platform
  namespace: trongate-cloud
type: Opaque
stringData:
  root-password: CHANGE_ME
---
# Push credentials for PLATFORM_REGISTRY, mounted into the worker as ~/.docker/config.json.
# Create with: kubectl create secret docker-registry registry-push -n trongate-cloud \
#   --docker-server=registry.trongate.cloud --docker-username=... --docker-password=... \
#   --dry-run=client -o yaml   (then encrypt with SOPS)
apiVersion: v1
kind: Secret
metadata:
  name: registry-push
  namespace: trongate-cloud
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.trongate.cloud":{"auth":"CHANGE_ME_BASE64_USER_COLON_TOKEN"}}}'
