# The worker creates tenants through the Kubernetes API. Permissions cover exactly
# the kinds Manifests emits (plus read access to pods/events for rollout diagnostics).
# worker-admission-policy.yaml further limits writes to tenant namespaces
# (project-*, and tc-team-* for projects created before db/020) and checks what
# the objects contain. Secrets are write-only: Kubernetes::apply is a
# server-side-apply PATCH, so the worker never reads a Secret (and must not be
# able to read the platform's, the operators' or Flux's). It deletes Secrets only
# as a collection filtered by its own labels (Platform_task::delete_owned), never
# by name: a DELETE response carries the deleted object, data included.
# Build daemon Pods in the buildkit namespace: ../buildkit/worker-rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trongate-worker
  namespace: trongate-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trongate-worker
rules:
  # Tenant namespaces: created by the first deploy of a project's app, deleted
  # by destroy_project once the project is deleted and empty. The admission
  # policy only lets the worker delete a Namespace with a tenant name and the
  # tenant labels Manifests::tenant() gives it.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "update", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Custom domains: per-domain Gateways and the per-namespace ACME Gateway
  # (Manifests::domain_gateway, acme_gateway). Listing finds the ones to prune.
  # Listing across namespaces finds Gateways a previous owner of a domain left
  # (Platform_task::release_domains). worker-admission-policy.yaml keeps writes
  # to tenant namespaces and checks the listeners.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # The certificates are cert-manager's: read-only, so recheck_domains can wait
  # for a custom domain's Certificate to be Ready before it becomes BASE_URL.
  # (Certificates hold no key material; that is in the Secret.)
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["databases", "users", "grants"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trongate-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trongate-worker
subjects:
  - kind: ServiceAccount
    name: trongate-worker
    namespace: trongate-cloud
