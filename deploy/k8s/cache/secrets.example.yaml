# EXAMPLE ONLY. Copy, fill in, encrypt with SOPS, never commit plaintext.
# Generate passwords with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: valkey-acl
  namespace: cache
type: Opaque
stringData:
  users.acl: |
    user default off
    user admin on >CHANGE_ME_ADMIN_PASSWORD ~* &* +@all
    # The worker: manages the per-app session users (tc_p{id}) and nothing else.
    # Same password as VALKEY_WORKER_PASSWORD in trongate-cloud-valkey (platform/secrets).
    user trongate-cloud on >CHANGE_ME_WORKER_PASSWORD resetchannels -@all +acl|setuser +acl|deluser +acl|save
