# Shared Valkey for customer app PHP sessions (they survive redeploys and scale-to-zero).
# ACL-enabled: the default user is off; every client authenticates as an ACL user.
# The worker (user trongate-cloud) creates one user per app, tc_p{id}, limited to keys
# tc_p{id}:* (Platform_task::ensure_session_user), and saves them with ACL SAVE to
# /data/users.acl on the volume. The init container seeds that file from the
# valkey-acl Secret on every start: users in the Secret are replaced by the Secret's
# lines, users the worker created are kept.
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-config
  namespace: cache
data:
  valkey.conf: |
    port 6379
    dir /data
    appendonly yes
    appendfsync everysec
    # Instance-wide; sessions should carry a TTL so volatile-lru can evict them
    maxmemory 768mb
    maxmemory-policy volatile-lru
    aclfile /data/users.acl
    # ACLs guard access (the default user is disabled in users.acl)
    protected-mode no
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: cache
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: cache
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: cache
spec:
  serviceName: valkey-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: acl
          image: valkey/valkey:9.1-alpine
          command:
            - sh
            - -c
            - |
              set -eu
              src=/etc/valkey/acl/users.acl
              dst=/data/users.acl
              touch "$dst"
              awk 'NR == FNR { if ($1 == "user") { seen[$2] = 1; print } next }
                   $1 == "user" && !($2 in seen)' "$src" "$dst" > "$dst.new"
              mv "$dst.new" "$dst"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: acl
              mountPath: /etc/valkey/acl
              readOnly: true
      containers:
        - name: valkey
          image: valkey/valkey:9.1-alpine
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 896Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey/valkey.conf
              subPath: valkey.conf
              readOnly: true
            - name: acl
              mountPath: /etc/valkey/acl
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: valkey-config
        - name: acl
          secret:
            secretName: valkey-acl
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi
