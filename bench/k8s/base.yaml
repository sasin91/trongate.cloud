# Throwaway benchmark namespace. Delete it all with: kubectl delete namespace bench
apiVersion: v1
kind: Namespace
metadata:
  name: bench
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: bench
spec:
  replicas: 1
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          # Same image and persistence settings as deploy/k8s/cache/valkey.yaml, no ACL
          image: valkey/valkey:9.1-alpine
          args: ["valkey-server", "--appendonly", "yes", "--dir", "/data", "--maxmemory", "768mb", "--maxmemory-policy", "volatile-lru"]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: bench
spec:
  selector: {app: valkey}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: bench
spec:
  selector: {app: bench-app}
  ports: [{name: http, port: 80, targetPort: 8080}]
